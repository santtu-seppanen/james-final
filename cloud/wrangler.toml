name = "james-cloud"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The config UI (public/) is served as static assets from the same Worker;
# anything without a matching file (i.e. /api/*) falls through to src/index.js.
[assets]
directory = "public"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "james-cloud"
# Replace with the id printed by `wrangler d1 create james-cloud` (see README.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# One device for now; every table is keyed by this so a second James could
# be added later with its own token.
DEVICE_ID = "james"

# Secrets - never in this file. Set with `wrangler secret put <NAME>`:
#   DEVICE_TOKEN  - bearer token the Pi uses (server/.env JAMES_CLOUD_DEVICE_TOKEN)
#   ADMIN_TOKEN   - bearer token typed into the config UI
# For local dev, put them in .dev.vars (gitignored, see .dev.vars.example).

[observability]
enabled = true
