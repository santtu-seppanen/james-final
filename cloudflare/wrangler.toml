name = "james-dashboard-api"
compatibility_date = "2024-09-23"
# The frontend lives on GitHub Pages (see dashboard/). This Pages project
# only exists to host the /functions API + D1 binding; "public" is a
# one-file placeholder, not the real dashboard.
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "james-dashboard"
database_id = "0aeba638-96cd-464f-b427-266a6e549f9f"

# REPORT_TOKEN is a secret, not set here. Set it with:
#   wrangler pages secret put REPORT_TOKEN
