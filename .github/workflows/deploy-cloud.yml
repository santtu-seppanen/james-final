name: Deploy cloud Worker

# Every push to main touching cloud/ runs the tests and, if they pass,
# applies D1 migrations and deploys the Worker. Needs the CLOUDFLARE_API_TOKEN
# (Workers Scripts:Edit, D1:Edit) and CLOUDFLARE_ACCOUNT_ID repo secrets; the
# DEVICE_TOKEN / ADMIN_TOKEN Worker secrets are set once with wrangler.

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/deploy-cloud.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: cloud
      - run: npm test
        working-directory: cloud

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # wrangler-action uses the project's pinned wrangler when installed.
      - run: npm ci
        working-directory: cloud

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          command: d1 migrations apply james-cloud --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          command: deploy
